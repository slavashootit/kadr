name: Release

# Publishes a release for the version in the VERSION file.
# Trigger: push a tag vX.Y.Z, or run this workflow manually (it creates the tag itself).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} != VERSION file ($VERSION)"; exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and pack
        run: ./build.sh dmg
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            build/Kadr.dmg
            build/Kadr.zip
          generate_release_notes: true
